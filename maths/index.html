/* Layout: graph-paper notebook. Sticky tab strip, one centred column (max 820px), cards only for things you interact with. */
/* Bright single theme by choice: always light, white paper, vivid ink. */
:root {
  --paper: #ffffff;
  --grid: rgba(0, 120, 255, 0.08);
  --surface: #ffffff;
  --ink: #101a3d;
  --ink-soft: #4b5677;
  --line: #d6e2ff;
  --pen: #0a5cff;
  --pen-soft: #e6f0ff;
  --mark: #ffe14d;
  --mark-ink: #101a3d;
  --pop: #ff4f9a;
  --pop2: #00c2a8;
  --good: #0f9d58;
  --good-soft: #dcf7e8;
  --warn: #c76a00;
  --warn-soft: #fff1d6;
  --bad: #e5322d;
  --bad-soft: #ffe3e1;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
header.top { background: linear-gradient(120deg, #e6f0ff 0%, #fff6c9 55%, #ffe3f0 100%); border-bottom: 3px solid var(--pen); }
.top-inner { padding-block: 28px 20px; }
header.top h1 { color: var(--pen); }
.card { border-width: 2px; }
.card:nth-child(4n+1) { border-top: 4px solid var(--pen); }
.card:nth-child(4n+2) { border-top: 4px solid var(--pop); }
.card:nth-child(4n+3) { border-top: 4px solid var(--pop2); }
.card:nth-child(4n+4) { border-top: 4px solid var(--mark); }
.method div:nth-child(3n+1) { background: var(--pen-soft); }
.method div:nth-child(3n+2) { background: #fff6c9; }
.method div:nth-child(3n+3) { background: #ffe3f0; }
.score { color: var(--pop); }
* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.6;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 820px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.15; margin: 0; }
h1 { font-size: clamp(30px, 6vw, 46px); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 18px; font-weight: 700; }
.hl { background: linear-gradient(transparent 55%, var(--mark) 55%); color: inherit; padding: 0 2px; }
.countdown { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; margin-top: 10px; color: var(--ink-soft); }
.countdown b { font-family: var(--f-mono); color: var(--pen); font-size: 20px; }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; padding-block: 8px; scrollbar-width: none; }
nav.tabs button { flex: 0 0 auto; font: 600 14px var(--f-body); color: var(--ink-soft); background: none; border: 1px solid transparent; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
nav.tabs button:hover { color: var(--ink); border-color: var(--line); }
nav.tabs button[aria-selected="true"] { background: var(--pen); color: var(--surface); }
nav.tabs .pct { font-family: var(--f-mono); font-size: 11px; opacity: .8; margin-left: 4px; }

main { padding-block: 26px 80px; }
section.view { display: flex; flex-direction: column; gap: 28px; }
.block { display: flex; flex-direction: column; gap: 12px; }
.lede { color: var(--ink-soft); max-width: 65ch; margin: 0; }
p { margin: 0; }
.steplabel { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--pen); }

button.btn { font: 600 14px var(--f-body); border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
button.btn:hover { border-color: var(--pen); }
button.btn.primary { background: var(--pen); color: var(--surface); border-color: var(--pen); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* method list */
.method { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.method div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.method h3 { font-size: 16px; margin-bottom: 4px; }
.method p { color: var(--ink-soft); font-size: 15px; }
.plan { display: flex; flex-direction: column; border-top: 1px solid var(--line); }

.plan .day { font-family: var(--f-display); font-weight: 700; }
.plan .day small { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 12px; color: var(--ink-soft); }
.plan ul { margin: 0; padding-left: 18px; }
@media (max-width: 520px) { .plan > div { grid-template-columns: 1fr; gap: 2px; } }

/* recall cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.card { text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; cursor: pointer; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.card .q { font-weight: 600; }
.card .a { display: none; border-top: 1px dashed var(--line); padding-top: 8px; font-size: 15px; overflow-x: auto; }
.card .tap { font-size: 12px; color: var(--ink-soft); font-family: var(--f-mono); }
.card.open .a { display: block; }
.card.open .tap { display: none; }
.card.open { border-color: var(--pen); }

/* worked + problems */
.prob { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.prob[data-r="got"] { border-left: 4px solid var(--good); }
.prob[data-r="shaky"] { border-left: 4px solid var(--warn); }
.prob[data-r="missed"] { border-left: 4px solid var(--bad); }
.prob .head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.prob .src { font-family: var(--f-mono); font-size: 12px; color: var(--ink-soft); }
.prob .qtext { overflow-x: auto; }
.steps { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; background: var(--pen-soft); border-radius: 8px; padding: 10px 12px 10px 40px; position: relative; overflow-x: auto; }
.steps li::before { content: counter(s); position: absolute; left: 12px; top: 10px; font-family: var(--f-mono); font-size: 13px; color: var(--pen); font-weight: 500; }
.final { background: var(--good-soft); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
.final b { color: var(--good); }
.check { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.check input { font: 500 15px var(--f-mono); width: 140px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.fb { font-size: 14px; font-weight: 600; }
.fb.ok { color: var(--good); } .fb.no { color: var(--bad); }
.rate { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 14px; color: var(--ink-soft); }
.rate button { font: 600 13px var(--f-body); border-radius: 999px; padding: 5px 12px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.rate button[data-v="got"][aria-pressed="true"] { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.rate button[data-v="shaky"][aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.rate button[data-v="missed"][aria-pressed="true"] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }

.traps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.traps li { border-left: 3px solid var(--bad); padding: 4px 0 4px 12px; overflow-x: auto; }
.traps li b { color: var(--bad); }

/* quiz */
.quizbox { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.qmeta { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 13px; color: var(--ink-soft); }
.bar { height: 6px; background: var(--pen-soft); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pen); width: 0; transition: width .3s; }
.choices { display: grid; gap: 8px; }
.choices button { text-align: left; font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; overflow-x: auto; }
.choices button:hover:not(:disabled) { border-color: var(--pen); }
.choices button.right { background: var(--good-soft); border-color: var(--good); }
.choices button.wrong { background: var(--bad-soft); border-color: var(--bad); }
.choices button:disabled { cursor: default; }
.explain { background: var(--pen-soft); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
.score { font-family: var(--f-display); font-size: 44px; font-weight: 800; color: var(--pen); }
.empty { color: var(--ink-soft); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 18px; }
.revitem { display: flex; justify-content: space-between; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; flex-wrap: wrap; }
.revitem .t { min-width: 0; flex: 1 1 260px; overflow-x: auto; }
.pill { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; }
.pill.missed { background: var(--bad-soft); color: var(--bad); }
.pill.shaky { background: var(--warn-soft); color: var(--warn); }
table.mini { border-collapse: collapse; font-size: 14px; width: 100%; }
table.mini td, table.mini th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script>
const R = String.raw;

/* ---------------- CONTENT ---------------- */
const TOPICS = [
{
  id: 't21', code: '2.1', name: 'Functions, limits & continuity',
  exam: 'Domain and range, contextual domain, compositions, income and profit, limits from a graph, one-sided limits, asymptotes, continuity of piecewise functions, classifying discontinuities, finding a parameter that makes f continuous.',
  cards: [
    { q: 'What three things shrink a domain?', a: R`No division by zero: \(\dfrac{1}{x}\) needs \(x\neq 0\).<br>No square root of a negative: \(\sqrt{x}\) needs \(x\ge 0\).<br>No log of zero or negatives: \(\ln x\) needs \(x\gt 0\).` },
    { q: 'Domain and range of the basic functions', a: R`<table class="mini"><tr><th>f</th><th>D(f)</th><th>R(f)</th></tr>
      <tr><td>\(x^2\)</td><td>\(\mathbb{R}\)</td><td>\([0,+\infty)\)</td></tr>
      <tr><td>\(\sqrt{x}\)</td><td>\([0,+\infty)\)</td><td>\([0,+\infty)\)</td></tr>
      <tr><td>\(\dfrac{1}{x}\)</td><td>\(\mathbb{R}\setminus\{0\}\)</td><td>\(\mathbb{R}\setminus\{0\}\)</td></tr>
      <tr><td>\(e^x\)</td><td>\(\mathbb{R}\)</td><td>\((0,+\infty)\)</td></tr>
      <tr><td>\(\ln x\)</td><td>\((0,+\infty)\)</td><td>\(\mathbb{R}\)</td></tr>
      <tr><td>\(|x|\)</td><td>\(\mathbb{R}\)</td><td>\([0,+\infty)\)</td></tr>
      <tr><td>\(\lfloor x\rfloor\)</td><td>\(\mathbb{R}\)</td><td>\(\mathbb{Z}\)</td></tr></table>` },
    { q: 'What is the contextual domain?', a: R`The mathematical domain cut down to values that make sense in the problem. Prices and quantities can't be negative, and a price must stay positive. Example: \(p(x)=\dfrac{-0.27x+51}{1000}\gt 0 \Rightarrow D_c=(0,\ 188.89)\).` },
    { q: R`What does \((f\circ g)(x)\) mean?`, a: R`\((f\circ g)(x)=f\big(g(x)\big)\): apply \(g\) first, then \(f\). Usually \(f\circ g\neq g\circ f\).<br>With \(f=x^2,\ g=x-1\): \(f\circ g=(x-1)^2\), but \(g\circ f=x^2-1\).` },
    { q: 'Income, profit, break-even', a: R`\(I(q)=q\cdot p(q)\)<br>\(\pi(q)=I(q)-C(q)\)<br>Break-even: solve \(\pi(q)=0\).` },
    { q: R`When does \(\displaystyle\lim_{x\to a}f(x)\) exist?`, a: R`When the left and right limits agree: \(\displaystyle\lim_{x\to a^-}f(x)=\lim_{x\to a^+}f(x)\). The value \(f(a)\) itself plays no role.` },
    { q: 'Limit rules with 0 and ∞', a: R`\(\dfrac{k}{\pm\infty}=0\qquad \dfrac{k}{0^{+}}=+\infty\ \ (k\gt 0)\qquad \dfrac{k}{0^{-}}=-\infty\ \ (k\gt 0)\)<br>\(e^{+\infty}=+\infty\qquad e^{-\infty}=0\)<br>\(\ln(+\infty)=+\infty\qquad \ln(0^+)=-\infty\)<br>\((+\infty)^k=+\infty\ (k\gt 0)\)` },
    { q: 'Vertical vs horizontal asymptote', a: R`<b>Vertical</b> \(x=a\): a one-sided limit at \(a\) is \(\pm\infty\).<br><b>Horizontal</b> \(y=L\): \(\displaystyle\lim_{x\to\pm\infty}f(x)=L\) (finite). Say which side: left (\(-\infty\)) or right (\(+\infty\)).` },
    { q: R`Continuity at \(x=a\): the three checks`, a: R`1. \(f(a)\) exists<br>2. \(\displaystyle\lim_{x\to a}f(x)\) exists (left = right)<br>3. \(\displaystyle\lim_{x\to a}f(x)=f(a)\)` },
    { q: 'Three types of discontinuity', a: R`<b>Removable:</b> the limit exists but differs from \(f(a)\) (or \(f(a)\) is undefined).<br><b>Jump:</b> both one-sided limits are finite but different.<br><b>Infinite:</b> a one-sided limit is \(\pm\infty\).` }
  ],
  worked: {
    title: 'Find a so that a piecewise function is continuous',
    src: 'Practice Problems 2.1, P6',
    q: R`\[f(x)=\begin{cases}\dfrac{1}{3-x} & \text{if } x\lt 1\\[6pt] -x^2+a & \text{if } x\ge 1\end{cases}\] Find the value of \(a\) that makes \(f\) continuous, and classify the discontinuity if \(a\) takes any other value.`,
    steps: [
      R`Each piece is continuous on its own interval. \(\dfrac{1}{3-x}\) only breaks at \(x=3\), which is not in \(x\lt 1\). So the only point to check is the join, \(x=1\).`,
      R`Left limit, using the top piece: \(\displaystyle\lim_{x\to 1^-}\dfrac{1}{3-x}=\dfrac{1}{3-1}=\dfrac{1}{2}\)`,
      R`Right limit and the value, using the bottom piece: \(\displaystyle\lim_{x\to 1^+}(-x^2+a)=f(1)=-1+a\)`,
      R`Set them equal: \(\dfrac{1}{2}=-1+a \Rightarrow a=\dfrac{3}{2}\)`,
      R`If \(a\neq\dfrac{3}{2}\), both one-sided limits are finite but different, so it is a <b>jump</b> discontinuity at \(x=1\).`
    ],
    final: R`\(a=\dfrac{3}{2}\). For any other \(a\): jump discontinuity at \(x=1\).`
  },
  problems: [
    { id: 'p21a', src: 'Lecture 2.1', q: R`Find the domain of \(j(x)=\ln(x+2)\) and of \(h(x)=\sqrt{x-1}\).`,
      steps: [R`A log needs a strictly positive argument: \(x+2\gt 0\Rightarrow x\gt -2\).`, R`A square root needs a non-negative argument: \(x-1\ge 0\Rightarrow x\ge 1\).`],
      final: R`\(D(j)=(-2,+\infty)\), \(D(h)=[1,+\infty)\).` },
    { id: 'p21b', src: 'Practice 2.1, P4', q: R`A firm has price \(P(q)=107-2q\) and cost \(C(q)=200+3q\). Find the profit function and the break-even quantity.`,
      steps: [R`\(I(q)=q\cdot P(q)=107q-2q^2\)`, R`\(\Pi(q)=I(q)-C(q)=-2q^2+104q-200\)`, R`Solve \(-2q^2+104q-200=0\), i.e. \(q^2-52q+100=0\): \(q=\dfrac{52\pm\sqrt{2704-400}}{2}=\dfrac{52\pm 48}{2}\), so \(q=2\) or \(q=50\).`, R`Break-even means the moment losses turn into profit, which is the smaller root.`],
      final: R`\(\Pi(q)=-2q^2+104q-200\). Break-even at \(q=2\). (At \(q=50\) the firm goes back into losses.)`, num: 2, numLabel: 'q =' },
    { id: 'p21c', src: 'Practice 2.1, P2', q: R`Let \(f(x)=e^{|x|}\) and \(g(x)=\dfrac{1}{x-3}\). Find \(h=f\circ g\) and \(m=g\circ f\) and their domains.`,
      steps: [R`\(h(x)=f\big(g(x)\big)=e^{\left|\frac{1}{x-3}\right|}\). The fraction needs \(x\neq 3\).`, R`\(m(x)=g\big(f(x)\big)=\dfrac{1}{e^{|x|}-3}\). The denominator is zero when \(e^{|x|}=3\), i.e. \(|x|=\ln 3\).`],
      final: R`\(D(h)=\mathbb{R}\setminus\{3\}\), \(D(m)=\mathbb{R}\setminus\{-\ln 3,\ \ln 3\}\). Range of \(h\) is \((1,+\infty)\) because the exponent is always positive.` },
    { id: 'p21d', src: 'Practice 2.1, P5', q: R`\[f(x)=\begin{cases}x^2 & -4\lt x\lt 0\\ 1-x & 0\le x\le 1\\ (1-x)^2 & 1\lt x\lt 4\end{cases}\] Study the continuity of \(f\) and classify any discontinuities without a graph.`,
      steps: [R`Every piece is a polynomial, so only the joins \(x=0\) and \(x=1\) need checking.`, R`At \(x=0\): left \(=0^2=0\), right \(=1-0=1\). Finite and different.`, R`At \(x=1\): left \(=1-1=0\), right \(=(1-1)^2=0\), and \(f(1)=0\). All three agree.`],
      final: R`Jump discontinuity at \(x=0\). Continuous at \(x=1\). Continuous everywhere else in \((-4,4)\).` },
    { id: 'p21e', src: 'Practice 2.1, P6a', q: R`Calculate \(\displaystyle\lim_{x\to-\infty}\left(\dfrac{1}{3-x}+2\right)\).`,
      steps: [R`As \(x\to-\infty\), \(3-x\to+\infty\).`, R`So \(\dfrac{1}{3-x}\to\dfrac{1}{+\infty}=0\).`],
      final: R`\(0+2=2\). So \(y=2\) is a horizontal asymptote on the left.`, num: 2, numLabel: 'limit =' },
    { id: 'p21f', src: 'Practice 2.1, P3', q: R`\(g(x)=e^{-2|x|}\) if \(x\neq 0\), and \(g(0)=0\). Is \(g\) continuous at 0? Does it have asymptotes?`,
      steps: [R`\(\displaystyle\lim_{x\to 0}e^{-2|x|}=e^0=1\) from both sides, so the limit exists.`, R`But \(g(0)=0\neq 1\).`, R`As \(x\to\pm\infty\), \(-2|x|\to-\infty\), so \(e^{-2|x|}\to 0\).`],
      final: R`Removable discontinuity at \(x=0\). Horizontal asymptote \(y=0\) on both sides, no vertical asymptotes. Range \([0,1)\).` }
  ],
  traps: [
    R`<b>Using \(f(a)\) to find a limit.</b> The limit only cares about values near \(a\), never at \(a\).`,
    R`<b>Checking one side only.</b> For a limit at a join you must compute both the left and the right piece.`,
    R`<b>Forgetting the context.</b> If \(x\) is units produced or a price, the contextual domain starts at 0 or above.`,
    R`<b>\(\ln\) of zero.</b> The domain of \(\ln x\) is \(x\gt 0\), strictly. Zero is excluded.`,
    R`<b>Wrong order in composition.</b> In \(f\circ g\) the inside function is \(g\).`
  ]
},
{
  id: 't22', code: '2.2', name: 'Derivatives',
  exam: 'Rules (product, quotient, chain), interpreting f′(a) with units, average vs instantaneous rate, tangent line and linear approximation, differentiability vs continuity.',
  cards: [
    { q: 'What does f′(a) mean?', a: R`The instantaneous rate of change of \(f\) at \(a\), and the slope of the tangent line there.<br>\(f'(a)\gt 0\): increasing. \(f'(a)\lt 0\): decreasing.<br>\[f'(a)=\lim_{h\to 0}\dfrac{f(a+h)-f(a)}{h}\]` },
    { q: 'Units of a derivative', a: R`Units of \(f\) divided by units of \(x\).<br>Profit in thousands of € per day, so \(\pi'(t)\) is in thousands of € per day. \(\pi'(50)=0.018\) means "growing by about €18 per day on day 50".` },
    { q: 'What does "marginal" mean?', a: R`Marginal = derivative. \(C'(q)\) is the marginal cost: roughly the extra cost of one more unit.` },
    { q: 'Basic derivatives', a: R`\((a+bx)'=b\)<br>\((x^n)'=n\,x^{n-1}\)<br>\((e^x)'=e^x\)<br>\((\ln x)'=\dfrac{1}{x}\)<br>\((\sqrt{x})'=\dfrac{1}{2\sqrt{x}}\qquad \left(\dfrac{1}{x}\right)'=-\dfrac{1}{x^2}\)` },
    { q: 'Product rule', a: R`\((f\cdot g)'=f'\cdot g+f\cdot g'\)` },
    { q: 'Quotient rule', a: R`\[\left(\dfrac{f}{g}\right)'=\dfrac{f'\cdot g-f\cdot g'}{g^2}\] Order on top: derivative of the top first.` },
    { q: 'Chain rule (and the three shortcuts)', a: R`\(\big(f(g(x))\big)'=f'\big(g(x)\big)\cdot g'(x)\)<br>\(\big(e^{u}\big)'=e^{u}\cdot u'\)<br>\(\big(\ln u\big)'=\dfrac{u'}{u}\)<br>\(\big(u^n\big)'=n\,u^{n-1}\cdot u'\)` },
    { q: 'Tangent line at x = a', a: R`\[L(x)=f(a)+f'(a)\,(x-a)\] Also called the linear approximation: \(f(x)\approx L(x)\) near \(a\).` },
    { q: 'Average rate of change on [a, b]', a: R`\[\dfrac{f(b)-f(a)}{b-a}\] This is the slope of the secant. The derivative is its limit as the interval shrinks.` },
    { q: 'Differentiable vs continuous', a: R`Differentiable ⇒ continuous. The converse is false: \(|x|\) is continuous at 0 but has a corner there, so it is not differentiable.` }
  ],
  worked: {
    title: 'Product rule plus chain rule',
    src: 'Lecture 2.2, Example 1a',
    q: R`Calculate \(\left(x^2\,e^{1/x}\right)'\).`,
    steps: [
      R`It's a product, so set \(f=x^2\) and \(g=e^{1/x}\). Then \((fg)'=f'g+fg'\).`,
      R`\(f'=2x\).`,
      R`\(g\) needs the chain rule, with inside \(u=\dfrac{1}{x}\) and \(u'=-\dfrac{1}{x^2}\). So \(g'=e^{1/x}\cdot\left(-\dfrac{1}{x^2}\right)\).`,
      R`Put it together: \(2x\,e^{1/x}+x^2\cdot e^{1/x}\cdot\left(-\dfrac{1}{x^2}\right)=2x\,e^{1/x}-e^{1/x}\)`,
      R`Factor out \(e^{1/x}\).`
    ],
    final: R`\(\left(x^2e^{1/x}\right)'=e^{1/x}(2x-1)\)`
  },
  problems: [
    { id: 'p22a', src: 'Lecture 2.2', q: R`Differentiate \(\dfrac{e^x}{x^2}\) using the quotient rule.`,

    { id: 'p22b', src: 'Practice 2.2, P8', q: R`Daily revenue (thousands of €) is \(R(t)=0.01t^3-0.6t^2+15t+20\), with \(t\) in days. (a) Average rate of change from day 20 to day 22? (b) \(R'(20)\) and its meaning?`,

    { id: 'p22c', src: 'Practice 2.2, P8d', q: R`Same \(R(t)\). Write the tangent line at \(t=20\) and use it to estimate \(R(20.5)\).`,

      final: R`\(R(20.5)\approx 161.5\) thousand €, i.e. about €161,500. (The exact value is 161.50125.)`, num: 161.5, numLabel: 'R(20.5) ≈' },
    { id: 'p22d', src: 'Practice 2.2, P9', q: R`Demand is \(q(p)=800e^{-0.04p}\) and revenue is \(I(p)=p\,q(p)\). Find \(q'(p)\) and \(I'(p)\).`,
      steps: [R`Chain rule: \(q'(p)=800e^{-0.04p}\cdot(-0.04)=-32e^{-0.04p}\). It's always negative, so demand falls as price rises.`, R`Product rule on \(800p\,e^{-0.04p}\): \(800e^{-0.04p}+800p\cdot e^{-0.04p}\cdot(-0.04)\)`, R`Factor out \(800e^{-0.04p}\).`],
      final: R`\(q'(p)=-32e^{-0.04p}\), \(I'(p)=800e^{-0.04p}(1-0.04p)\)` },
    { id: 'p22e', src: 'Practice 2.2, P10', q: R`\(C(x)=1200+18x+0.03x^2\) and \(A(x)=\dfrac{C(x)}{x}\). Find \(C'(100)\) and \(A'(100)\), then interpret them.`,

{
  id: 't23', code: '2.3', name: 'Function analysis & optimization',
  exam: 'Stationary points, increasing/decreasing intervals, second derivative test, concavity and inflection points, global max/min on a contextual domain (always compare endpoints), piecewise profit with kinks.',
  cards: [
    { q: 'What is a stationary point?', a: R`A point where the tangent is horizontal: \(f'(x^*)=0\).` },
    { q: 'Where can a max or min be?', a: R`Only at these candidates:<br>1. stationary points (\(f'=0\))<br>2. endpoints of the (contextual) domain<br>3. points where \(f\) is not continuous or not differentiable (kinks, joins)<br>A max is <b>not</b> always where \(f'=0\).` },
    { q: 'Second derivative test', a: R`At a stationary point \(x^*\):<br>\(f''(x^*)\gt 0\) ⇒ local <b>min</b> (cup shape)<br>\(f''(x^*)\lt 0\) ⇒ local <b>max</b> (cap shape)<br>\(f''(x^*)=0\) ⇒ inconclusive, so use a sign table of \(f'\).` },
    { q: 'Increasing and decreasing intervals', a: R`Find where \(f'=0\), then test the sign of \(f'\) in each interval.<br>\(f'\gt 0\): increasing. \(f'\lt 0\): decreasing.<br>A sign change from \(+\) to \(-\) is a max, from \(-\) to \(+\) a min.` },
    { q: 'Concavity and inflection point', a: R`\(f''\gt 0\): concave upwards. \(f''\lt 0\): concave downwards.<br>Inflection: \(f''(a)=0\) <b>and</b> the sign of \(f''\) changes. Example: \(x^3\) at 0.` },
    { q: 'Global vs local', a: R`Local: highest or lowest compared with nearby points. Global: highest or lowest on the whole (contextual) domain. Find it by evaluating \(f\) at <b>every</b> candidate and comparing.` },
    { q: 'The 6-step optimization recipe', a: R`1. Contextual domain<br>2. \(f'(x)\)<br>3. Solve \(f'=0\) and list kinks and joins<br>4. Classify (sign of \(f'\) or \(f''\))<br>5. Evaluate \(f\) at all candidates <b>and</b> endpoints<br>6. Answer in context, with units` }
  ],
  worked: {
    title: 'Optimize advertising spend on a closed domain',
    src: 'Practice 2.3, P6',
    q: R`Monthly profit (thousands of €) is \(P(x)=150-200e^{-0.2x}-10x\), where \(x\) is advertising spend in thousands of €, \(0\le x\le 20\). Find the global maximum and minimum.`,
    steps: [
      R`\(P'(x)=-200e^{-0.2x}\cdot(-0.2)-10=40e^{-0.2x}-10\)`,
      R`\(P'(x)=0\Rightarrow e^{-0.2x}=\dfrac{1}{4}\Rightarrow -0.2x=\ln\dfrac{1}{4}=-\ln 4\Rightarrow x=5\ln 4\approx 6.93\). This lies in \([0,20]\).`,
      R`\(P''(x)=-8e^{-0.2x}\lt 0\) for every \(x\), so \(x=5\ln 4\) is a local max.`,
      R`Compare the candidates: \(P(0)=150-200-0=-50\). \(P(20)=150-200e^{-4}-200\approx-53.66\). \(P(6.93)=150-50-69.31\approx 30.69\).`,
      R`The largest value is the global max, the smallest the global min.`
    ],
    final: R`Global max at \(x=5\ln4\approx 6.93\): spend about €6,930 for a profit of about €30,690. Global min at the endpoint \(x=20\).`
  },
  problems: [
    { id: 'p23a', src: 'Lecture 2.3', q: R`Daily profit is \(\pi(q)=100q-q^2\). Find the optimal quantity and the maximum profit.`,
      steps: [R`\(\pi'(q)=100-2q=0\Rightarrow q^*=50\)`, R`\(\pi''(q)=-2\lt 0\), so it's a max.`, R`\(\pi(50)=5000-2500\)`],
      final: R`\(q^*=50\) units, \(\pi^*=€2500\).`, num: 2500, numLabel: 'max profit =' },
    { id: 'p23b', src: 'Lecture 2.3', q: R`\(\pi(x)=-2.5x^2+47.5x-85\) (\(x\) in thousands of units), \(D_c=(0,\ 188.89)\). Optimize the profit.`,
      steps: [R`\(\pi'(x)=-5x+47.5=0\Rightarrow x=9.5\)`, R`\(\pi''(x)=-5\lt 0\), so it's a local max.`, R`It is also the global max, because \(\pi\) is negative near both ends of the domain (\(\pi(0)=-85\)).`],
      final: R`\(x=9.5\), i.e. produce <b>9,500 units</b>. (Max profit \(\pi(9.5)=140.625\).)`, num: 9.5, numLabel: 'x =' },
    { id: 'p23c', src: 'Own example', q: R`For \(f(x)=x^3-3x\), find the increasing and decreasing intervals and all local extrema.`,
      steps: [R`\(f'(x)=3x^2-3=3(x-1)(x+1)=0\Rightarrow x=\pm 1\)`, R`Sign of \(f'\): \(+\) on \((-\infty,-1)\), \(-\) on \((-1,1)\), \(+\) on \((1,+\infty)\).`, R`\(f(-1)=-1+3=2\), \(f(1)=1-3=-2\)`],
      final: R`Increasing on \((-\infty,-1)\) and \((1,+\infty)\), decreasing on \((-1,1)\). Local max at \((-1,2)\), local min at \((1,-2)\).` },
    { id: 'p23d', src: 'Practice 2.3, P3', q: R`Profit (in \(x\) hundreds of units) is \[P(x)=\begin{cases}4x & x\le 1\\ x^2-2x+5 & 1\lt x\le 2\\ 7-x & x\gt 2\end{cases}\] on \(0.5\le x\le 3\). Where is \(P\) not differentiable, and which production maximizes profit?`,
      steps: [R`Check continuity at the joins. \(x=1\): \(4=1-2+5=4\) ✓. \(x=2\): \(4-4+5=5=7-2\) ✓. So \(P\) is continuous.`, R`Slopes at \(x=1\): left \(4\), right \(2x-2=0\). They differ, so there's a kink.`, R`Slopes at \(x=2\): left \(2x-2=2\), right \(-1\). They differ, so there's another kink.`, R`\(P\) increases on \([0.5,2]\) and decreases after 2, so the max is at the kink \(x=2\) with \(P(2)=5\).`],
      final: R`Not differentiable at \(x=1\) and \(x=2\). Max profit at \(x=2\), i.e. <b>200 units</b>. Here the max is at a kink, not where \(P'=0\).`, num: 2, numLabel: 'x =' },
    { id: 'p23e', src: 'Practice 2.3, P5', q: R`Is every stationary point an extreme point? Give a counterexample.`,
      steps: [R`Try \(f(x)=x^3\): \(f'(0)=0\), so 0 is stationary.`, R`But \(f'=3x^2\ge 0\) on both sides, so \(f\) keeps increasing through 0.`],
      final: R`No. \(x^3\) has a stationary <b>inflection</b> point at 0, which is neither a max nor a min.` },

      steps: [R`\(p=\dfrac{188\pm\sqrt{188^2-4\cdot 8811}}{2}=\dfrac{188\pm 10}{2}\Rightarrow p=89\) or \(p=99\)`, R`Candidates: \(0,\ 89,\ 99,\ 100\). Include the endpoints.`, R`Compare the values: 89 gives the largest.`],
      final: R`Optimal price \(p=89\), profit ≈ 111.33. \(p=99\) is a local min and \(p=100\) a local max (endpoint).`, num: 89, numLabel: 'p =' }
  ],
  traps: [
    R`<b>Skipping the endpoints.</b> On a closed contextual domain the global max or min is often at an endpoint.`,
    R`<b>\(f''=0\) means inflection?</b> Only if the sign of \(f''\) actually changes. Otherwise it's inconclusive.`,
    R`<b>Answering "x = 9.5" with no context.</b> If \(x\) is in thousands of units, write 9,500 units.`,
    R`<b>Ignoring kinks.</b> In a piecewise profit function, check the joins as candidates too.`,
    R`<b>Solving \(e^{-0.2x}=\tfrac14\).</b> Take \(\ln\) of both sides: \(\ln\tfrac14=-\ln 4\).`
  ]

{
  id: 't24', code: '2.4', name: 'Taylor approximation',
  exam: 'Build Pₙ(x) from derivatives, read derivatives back from a given Pₙ, sketch f near a using the sign of Pₙ − P₁ (above/below the tangent, concavity, inflection).',
  cards: [
    { q: 'Taylor polynomial of order n around a', a: R`\[P_n(x)=f(a)+f'(a)(x-a)+\dfrac{f''(a)}{2!}(x-a)^2+\cdots+\dfrac{f^{(n)}(a)}{n!}(x-a)^n\] \(P_1\) is the tangent line.` },
    { q: 'Factorials you need', a: R`\(2!=2\quad 3!=6\quad 4!=24\quad 5!=120\quad 6!=720\quad 7!=5040\)` },
    { q: 'Reading derivatives back from Pₙ', a: R`If the coefficient of \((x-a)^k\) is \(c_k\), then \[f^{(k)}(a)=k!\cdot c_k\] A missing power means that derivative is 0.` },
    { q: 'Sketching f near a', a: R`Look at the first term after the linear part, \(c\,(x-a)^m\). Its sign gives the sign of \(f-L\).<br><b>m even:</b> \(c\gt 0\) above the tangent on both sides (concave up). \(c\lt 0\) below (concave down).<br><b>m odd:</b> \(f\) crosses its tangent, so it's an inflection point. With \(c\gt 0\): below on the left, above on the right.` },
    { q: 'Must-know expansions around 0', a: R`\(e^x\approx 1+x+\dfrac{x^2}{2}+\dfrac{x^3}{6}\)<br>\(e^{-x^2}\approx 1-x^2\)<br>\(\ln x\) around 1: \((x-1)-\dfrac{(x-1)^2}{2}+\dfrac{(x-1)^3}{3}\)` },
    { q: 'Why Taylor at all?', a: R`Polynomials are easy to evaluate, differentiate, integrate and optimize. \(P_n\) has the same value and the same first \(n\) derivatives as \(f\) at \(a\). It's only valid near \(a\), and a higher order gives a better approximation.` }
  ],
  worked: {
    title: 'Third-order Taylor polynomial of ln x around 1',
    src: 'Lecture 2.4, Example 1',
    q: R`Let \(f(x)=\ln x\). Find \(P_3(x)\) around \(x=1\).`,
    steps: [
      R`\(f(1)=\ln 1=0\)`,
      R`\(f'(x)=\dfrac{1}{x}\Rightarrow f'(1)=1\)`,
      R`\(f''(x)=-\dfrac{1}{x^2}\Rightarrow f''(1)=-1\)`,
      R`\(f'''(x)=\dfrac{2}{x^3}\Rightarrow f'''(1)=2\)`,
      R`\(P_3=0+1\cdot(x-1)+\dfrac{-1}{2!}(x-1)^2+\dfrac{2}{3!}(x-1)^3\)`
    ],
    final: R`\(P_3(x)=(x-1)-\dfrac{1}{2}(x-1)^2+\dfrac{1}{3}(x-1)^3\)`
  },
  problems: [
    { id: 'p24a', src: 'Practice 2.4, P9', q: R`Find the third-order Taylor polynomial of \(f(x)=2e^x-x^2\) at \(x=0\), and the tangent line there.`,
      steps: [R`\(f(0)=2\). \(f'=2e^x-2x\Rightarrow f'(0)=2\).`, R`\(f''=2e^x-2\Rightarrow f''(0)=0\). \(f'''=2e^x\Rightarrow f'''(0)=2\).`, R`\(P_3=2+2x+0+\dfrac{2}{6}x^3\)`],
      final: R`\(P_3(x)=2+2x+\dfrac{x^3}{3}\). Tangent line \(y=2+2x\), which is \(P_1\).` },
    { id: 'p24b', src: 'Practice 2.4, P10', q: R`\(P_4(x)=-3(x-2)-(x-2)^4\) around \(a=2\). Find \(f(2),\ f'(2),\ f''(2),\ f'''(2),\ f^{(4)}(2)\) and describe \(f\) near 2.`,
      steps: [R`There's no constant term, so \(f(2)=0\). The coefficient of \((x-2)\) gives \(f'(2)=-3\).`, R`No \((x-2)^2\) or \((x-2)^3\) terms, so \(f''(2)=f'''(2)=0\).`, R`\(f^{(4)}(2)=4!\cdot(-1)=-24\)`, R`\(P_4-P_1=-(x-2)^4\le 0\): even power with a negative coefficient.`],
      final: R`\(0,\ -3,\ 0,\ 0,\ -24\). \(f\) lies <b>below</b> its tangent on both sides, so it's concave downwards near 2.`, num: -24, numLabel: 'f⁽⁴⁾(2) =' },
    { id: 'p24c', src: 'Practice 2.4, P7', q: R`\(P_7(x)=-2(x-4)-3(x-4)^7\) around \(a=4\). Sketch \(f\) near 4.`,

    { id: 'p24d', src: 'Practice 2.4, P8', q: R`Profit \(\pi(t)=e^{t/2}-\dfrac{1}{2}t^2\). Find \(P_2(t)\) around \(t=0\) and the concavity at 0.`,

      final: R`\(P_2(t)=1+\dfrac{1}{2}t-\dfrac{3}{8}t^2\). The coefficient \(-\dfrac{3}{8}\lt 0\), so \(\pi\) is below its tangent: concave downwards.`, num: -0.375, numLabel: 'coef of t² =' },

    { id: 'p24g', src: 'Practice 2.4, P12', q: R`With \(Q_n\) the Taylor polynomials of \(e^x\) at 0, write \(g(x)=Q_2\big(Q_1(x)\big)\).`,
      steps: [R`\(Q_1(x)=1+x\), \(Q_2(x)=1+x+\dfrac{x^2}{2}\)`, R`\(Q_2(1+x)=1+(1+x)+\dfrac{(1+x)^2}{2}\)`, R`Expand: \(\dfrac{4+2x+1+2x+x^2}{2}\)`],

  ],
  traps: [

    R`<b>Even vs odd confusion.</b> An even first non-linear power means a cup or cap. An odd one means an inflection.`,

  ]

{
  id: 't25', code: '2.5', name: 'Integration',

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function renderTabs() {
  const tabs = $('#tabs'); tabs.innerHTML = '';
  VIEWS.forEach(v => {
    const b = h('button', { role: 'tab', 'aria-selected': String(v.id === current), 'data-id': v.id });

    if (v.id === 'review') { const n = reviewItems().length; if (n) b.innerHTML += `<span class="pct">${n}</span>`; }
    b.onclick = () => go(v.id);
    tabs.appendChild(b);
  });
}
function go(id) { current = id; try { history.replaceState(null, '', '#' + id); } catch (e) {} render(); window.scrollTo({ top: 0 }); }

function render() {
  renderTabs();
  const main = $('#main'); main.innerHTML = '';
  const v = VIEWS.find(x => x.id === current) || VIEWS[0];
  let view;
  if (v.id === 'plan') view = planView();
  else if (v.id === 'quiz') view = quizView();
  else if (v.id === 'review') view = reviewView();
  else view = topicView(v.topic);
  main.appendChild(view);
  typeset(main);
}

  return s;
}

function topicView(t) {
  const s = h('section', { class: 'view' });
  s.appendChild(h('div', { class: 'block' }, `<span class="steplabel">Topic ${t.code}</span><h2>${t.name}</h2><p class="lede"><b>What gets tested:</b> ${t.exam}</p>`));

  // recall cards
  const cb = h('div', { class: 'block' }, `<span class="steplabel">Step 1 · Recall first</span><h3>Answer each card in your head before you tap it</h3>`);
  const grid = h('div', { class: 'cards' });
  t.cards.forEach(c => {
    const card = h('button', { class: 'card', type: 'button' }, `<span class="q">${c.q}</span><span class="tap">tap to check</span><div class="a">${c.a}</div>`);
    card.onclick = () => card.classList.toggle('open');
    grid.appendChild(card);
  });
  cb.appendChild(grid);
  const rowc = h('div', { class: 'row' });
  const openAll = h('button', { class: 'btn', type: 'button' }, 'Uncover all');
  openAll.onclick = () => { const all = grid.querySelectorAll('.card'); const anyClosed = [...all].some(x => !x.classList.contains('open')); all.forEach(x => x.classList.toggle('open', anyClosed)); openAll.textContent = anyClosed ? 'Cover all' : 'Uncover all'; };
  rowc.appendChild(openAll); cb.appendChild(rowc);
  s.appendChild(cb);

  // worked example
  const w = t.worked;
  const wb = h('div', { class: 'block' }, `<span class="steplabel">Step 2 · Worked example</span><h3>${w.title}</h3>`);
  const wcard = h('div', { class: 'prob' });
  wcard.innerHTML = `<div class="head"><span class="src">${w.src}</span></div><div class="qtext">${w.q}</div>`;
  const ol = h('ol', { class: 'steps' }); wcard.appendChild(ol);
  const fin = h('div', { class: 'final' }, `<b>Result:</b> ${w.final}`); fin.hidden = true;
  const wrow = h('div', { class: 'row' });
  const nb = h('button', { class: 'btn primary', type: 'button' }, 'Predict, then show step 1');
  let k = 0;
  nb.onclick = () => {
    if (k < w.steps.length) { const li = h('li', {}, w.steps[k]); ol.appendChild(li); typeset(li); k++; }
    if (k >= w.steps.length) { fin.hidden = false; typeset(fin); nb.hidden = true; }
    else nb.textContent = `Predict, then show step ${k + 1}`;
  };
  wrow.appendChild(nb); wcard.appendChild(fin); wcard.appendChild(wrow);
  wb.appendChild(wcard); s.appendChild(wb);

  // problems
  const pb = h('div', { class: 'block' }, `<span class="steplabel">Step 3 · Your turn, on paper</span><h3>Practice problems</h3><p class="lede">Solve each one fully before opening anything. Hints come one at a time.</p>`);
  t.problems.forEach((p, i) => pb.appendChild(problemCard(p, i + 1)));
  s.appendChild(pb);

  // traps
  const tb = h('div', { class: 'block' }, `<span class="steplabel">Before you move on</span><h3>Common traps in ${t.code}</h3>`);
  const ul = h('ul', { class: 'traps' }); t.traps.forEach(x => ul.appendChild(h('li', {}, x))); tb.appendChild(ul);
  s.appendChild(tb);

  const idx = TOPICS.indexOf(t);
  const nav = h('div', { class: 'row' });
  if (idx < TOPICS.length - 1) { const nx = h('button', { class: 'btn primary', type: 'button' }, `Next: ${TOPICS[idx + 1].code} ${TOPICS[idx + 1].name}`); nx.onclick = () => go(TOPICS[idx + 1].id); nav.appendChild(nx); }
  const qz = h('button', { class: 'btn', type: 'button' }, 'Mixed quiz'); qz.onclick = () => go('quiz'); nav.appendChild(qz);
  s.appendChild(nav);
  return s;
}

function problemCard(p, n) {
  const c = h('div', { class: 'prob', 'data-r': state.ratings[p.id] || '' });
  c.innerHTML = `<div class="head"><h3>Problem ${n}</h3><span class="src">${p.src}</span></div><div class="qtext">${p.q}</div>`;
  const ol = h('ol', { class: 'steps' }); c.appendChild(ol);
  const fin = h('div', { class: 'final' }, `<b>Answer:</b> ${p.final}`); fin.hidden = true;

  if (typeof p.num === 'number') {
    const ck = h('div', { class: 'check' });
    const inId = 'in-' + p.id;
    ck.innerHTML = `<label for="${inId}">${p.numLabel}</label><input id="${inId}" inputmode="decimal" autocomplete="off" placeholder="your answer"><button class="btn" type="button">Check</button><span class="fb" aria-live="polite"></span>`;
    const inp = $('input', ck), fb = $('.fb', ck);
    const doCheck = () => {
      const v = parseFloat(inp.value.replace(',', '.').replace(/[^0-9.\-eE]/g, ''));
      if (isNaN(v)) { fb.className = 'fb no'; fb.textContent = 'Type a number first.'; return; }
      const ok = Math.abs(v - p.num) <= Math.max(0.011, Math.abs(p.num) * 0.01);
      fb.className = 'fb ' + (ok ? 'ok' : 'no');
      fb.textContent = ok ? 'Correct. Now check your method against the solution.' : 'Not quite. Look for the slip, or open a hint.';
    };
    $('button', ck).onclick = doCheck;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') doCheck(); });
    c.appendChild(ck);
  }

  const row = h('div', { class: 'row' });
  const hint = h('button', { class: 'btn', type: 'button' }, 'Hint');
  const sol = h('button', { class: 'btn', type: 'button' }, 'Show full solution');
  let k = 0;
  hint.onclick = () => {
    if (k < p.steps.length) { const li = h('li', {}, p.steps[k]); ol.appendChild(li); typeset(li); k++; }
    hint.textContent = k < p.steps.length ? `Next hint (${k}/${p.steps.length})` : 'All hints shown';
    if (k >= p.steps.length) hint.disabled = true;
  };
  sol.onclick = () => {
    while (k < p.steps.length) { ol.appendChild(h('li', {}, p.steps[k])); k++; }
    hint.disabled = true; hint.textContent = 'All hints shown';
    fin.hidden = false; sol.hidden = true; typeset(c);
  };
  row.append(hint, sol);
  c.appendChild(row); c.appendChild(fin);

  const rate = h('div', { class: 'rate' }, '<span>How did it go?</span>');
  [['got', 'Got it'], ['shaky', 'Shaky'], ['missed', 'Missed']].forEach(([v, l]) => {
    const b = h('button', { type: 'button', 'data-v': v, 'aria-pressed': String(state.ratings[p.id] === v) }, l);
    b.onclick = () => {
      state.ratings[p.id] = v; save();
      c.dataset.r = v;
      rate.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.v === v)));
      renderTabs();
    };
    rate.appendChild(b);
  });
  c.appendChild(rate);
  return c;
}

/* quiz */
let quiz = null;
function newQuiz(n = 10, pool = QUIZ) { quiz = { items: shuffle(pool).slice(0, Math.min(n, pool.length)), i: 0, score: 0, answered: false, misses: [] }; }
function quizView() {
  const s = h('section', { class: 'view' });
  s.appendChild(h('div', { class: 'block' }, `<span class="steplabel">Interleaved practice</span><h2>Mixed quiz</h2><p class="lede">Ten questions drawn from all five topics, in random order. Work it out on paper before you click. Questions you miss go to the Review tab.</p>`));
  if (!quiz) newQuiz();
  const box = h('div', { class: 'quizbox' });
  s.appendChild(box);
  drawQuiz(box);
  return s;
}
function drawQuiz(box) {
  box.innerHTML = '';
  if (quiz.i >= quiz.items.length) {
    const pct = Math.round(100 * quiz.score / quiz.items.length);
    box.innerHTML = `<span class="steplabel">Result</span><div class="score">${quiz.score} / ${quiz.items.length}</div>
      <p>${pct >= 90 ? 'Exam-ready on these. Do another round to check it wasn’t luck.' : pct >= 70 ? 'Solid. Redo the misses in the Review tab, then take another quiz.' : 'Go back to the topics where you missed questions and redo their practice problems.'}</p>`;
    if (quiz.misses.length) { const ul = h('ul', { class: 'traps' }); quiz.misses.forEach(m => ul.appendChild(h('li', {}, `<b>${m.t}</b> ${m.q}`))); box.appendChild(ul); }
    const row = h('div', { class: 'row' });
    const again = h('button', { class: 'btn primary', type: 'button' }, 'New quiz');
    again.onclick = () => { newQuiz(); drawQuiz(box); };
    const all = h('button', { class: 'btn', type: 'button' }, `Long quiz (all ${QUIZ.length})`);
    all.onclick = () => { newQuiz(QUIZ.length); drawQuiz(box); };
    row.append(again, all); box.appendChild(row);
    typeset(box); return;
  }
  const item = quiz.items[quiz.i];
  const qi = QUIZ.indexOf(item);
  box.innerHTML = `<div class="qmeta"><span>Question ${quiz.i + 1} of ${quiz.items.length} · Topic ${item.t}</span><span>Score ${quiz.score}</span></div>
    <div class="bar"><i style="width:${100 * quiz.i / quiz.items.length}%"></i></div><div class="qtext" style="font-size:17px;font-weight:600">${item.q}</div>`;
  const ch = h('div', { class: 'choices' });
  const order = shuffle(item.c.map((t, i) => i));
  const ex = h('div', { class: 'explain' }); ex.hidden = true;
  const next = h('button', { class: 'btn primary', type: 'button' }, quiz.i === quiz.items.length - 1 ? 'See result' : 'Next question'); next.hidden = true;
  order.forEach(ci => {
    const b = h('button', { type: 'button' }, item.c[ci]);
    b.onclick = () => {
      if (quiz.answered) return; quiz.answered = true;
      const right = ci === item.a;
      if (right) { quiz.score++; delete state.quizMiss[qi]; }
      else { quiz.misses.push(item); state.quizMiss[qi] = true; }
      save();
      ch.querySelectorAll('button').forEach((x, j) => { x.disabled = true; if (order[j] === item.a) x.classList.add('right'); });
      if (!right) b.classList.add('wrong');
      ex.innerHTML = `<b>${right ? 'Correct.' : 'Not this one.'}</b> ${item.e}`; ex.hidden = false; next.hidden = false;
      typeset(ex); next.focus(); renderTabs();
    };
    ch.appendChild(b);
  });
  next.onclick = () => { quiz.i++; quiz.answered = false; drawQuiz(box); };
  box.append(ch, ex, next);
  typeset(box);
}

/* review */
function reviewItems() {
  const out = [];
  TOPICS.forEach(t => t.problems.forEach((p, i) => { const r = state.ratings[p.id]; if (r === 'shaky' || r === 'missed') out.push({ kind: 'prob', t, p, r, n: i + 1 }); }));
  Object.keys(state.quizMiss).forEach(k => { if (QUIZ[k]) out.push({ kind: 'quiz', q: QUIZ[k], qi: +k }); });
  return out;
}
function reviewView() {
  const s = h('section', { class: 'view' });
  s.appendChild(h('div', { class: 'block' }, `<span class="steplabel">Spaced repetition</span><h2>Review</h2><p class="lede">Everything you rated Shaky or Missed, plus quiz questions you got wrong. Redo these at the start of each session, from a blank page. An item leaves the list once you rate it Got it or answer it correctly.</p>`));
  const items = reviewItems();
  if (!items.length) {
    s.appendChild(h('div', { class: 'empty' }, 'Nothing to review yet. Work through a topic and rate each problem honestly. Anything Shaky or Missed shows up here.'));
    return s;
  }
  const list = h('div', { class: 'block' });
  items.filter(x => x.kind === 'prob').forEach(x => {
    const it = h('div', { class: 'revitem' }, `<div class="t"><span class="pill ${x.r}">${x.r}</span> <b>${x.t.code} · Problem ${x.n}</b><br>${x.p.q}</div>`);
    const b = h('button', { class: 'btn', type: 'button' }, 'Redo it'); b.onclick = () => go(x.t.id);
    it.appendChild(b); list.appendChild(it);
  });
  const qm = items.filter(x => x.kind === 'quiz');
  if (qm.length) {
    list.appendChild(h('h3', {}, 'Missed quiz questions'));
    qm.forEach(x => {
      const it = h('div', { class: 'revitem' }, `<div class="t"><span class="pill missed">${x.q.t}</span> ${x.q.q}</div>`);
      const b = h('button', { class: 'btn', type: 'button' }, 'Show answer');
      b.onclick = () => { const d = h('div', { class: 'final' }, `<b>${x.q.c[x.q.a]}</b>. ${x.q.e}`); it.appendChild(d); typeset(d); b.remove(); };
      it.appendChild(b); list.appendChild(it);
    });
    const rq = h('button', { class: 'btn primary', type: 'button' }, 'Quiz me on just these');
    rq.onclick = () => { newQuiz(qm.length, qm.map(x => x.q)); go('quiz'); };
    list.appendChild(h('div', { class: 'row' })).appendChild(rq);
  }
  s.appendChild(list);
  const reset = h('button', { class: 'btn', type: 'button' }, 'Clear all ratings');
  let armed = false;
  reset.onclick = () => { if (!armed) { armed = true; reset.textContent = 'Click again to confirm'; return; } state = { ratings: {}, quizMiss: {} }; save(); render(); };
  s.appendChild(h('div', { class: 'row' })).appendChild(reset);
  return s;
}

/* boot */
const hash = (location.hash || '').slice(1);
if (VIEWS.some(v => v.id === hash)) current = hash;
render();
</script>
