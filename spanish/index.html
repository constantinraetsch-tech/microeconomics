<style>
/* Layout: phone-first app shell. One column (max 560px), sticky top bar, fixed bottom tab bar. Bright single theme by choice: sunny tiles, azulejo blue, coral. */
:root {
  --bg: #fffaf0;
  --surface: #ffffff;
  --ink: #1d2340;
  --ink-soft: #5d6485;
  --line: #ece4d2;
  --blue: #1f6bff;
  --blue-soft: #e5eeff;
  --sun: #ffc93c;
  --sun-soft: #fff3cf;
  --coral: #ff5a5f;
  --coral-soft: #ffe4e3;
  --green: #1fb36b;
  --green-dark: #128a51;
  --green-soft: #ddf7e9;
  --purple: #8a5cf6;
  --purple-soft: #efe8ff;
  --f-display: "Fredoka", "Avenir Next Rounded", "Segoe UI", sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 2px solid var(--line); }
.topbar .in { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 22px; color: var(--coral); letter-spacing: -0.01em; }
.brand span { color: var(--blue); }
.chips { display: flex; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 14px; padding: 4px 10px; border-radius: 999px; background: var(--sun-soft); }
.chip.xp { background: var(--blue-soft); color: var(--blue); }
.chip svg { width: 16px; height: 16px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: 30px; font-weight: 700; }
h2 { font-size: 22px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--ink-soft); }
.small { font-size: 14px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.view { display: flex; flex-direction: column; gap: 18px; padding-top: 18px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* buttons */
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; border: 0; border-radius: 16px; padding: 14px 20px; font-weight: 800; font-size: 16px; cursor: pointer; background: var(--surface); box-shadow: 0 0 0 2px var(--line) inset, 0 4px 0 var(--line); transition: transform .06s; }
.btn:active { transform: translateY(3px); box-shadow: 0 0 0 2px var(--line) inset, 0 1px 0 var(--line); }
.btn.big { width: 100%; font-size: 18px; padding: 16px 20px; text-transform: uppercase; letter-spacing: .03em; }
.btn.go { background: var(--green); color: #fff; box-shadow: 0 4px 0 var(--green-dark); }
.btn.go:active { box-shadow: 0 1px 0 var(--green-dark); }
.btn.blue { background: var(--blue); color: #fff; box-shadow: 0 4px 0 #134bc0; }
.btn.blue:active { box-shadow: 0 1px 0 #134bc0; }
.btn.coral { background: var(--coral); color: #fff; box-shadow: 0 4px 0 #c9393e; }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.btn.slim { padding: 8px 14px; font-size: 14px; border-radius: 12px; }
.link { background: none; border: 0; color: var(--blue); font-weight: 800; cursor: pointer; padding: 6px 0; }

/* home */
.hero { background: linear-gradient(135deg, var(--sun) 0%, #ffb347 100%); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; color: var(--ink); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -30px; top: -30px; width: 140px; height: 140px; border-radius: 28px; transform: rotate(18deg); background: rgba(255,255,255,.22); }
.hero h1 { position: relative; }
.hero .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; position: relative; }
.hero .stat { background: rgba(255,255,255,.75); border-radius: 14px; padding: 10px; text-align: center; }
.hero .stat b { display: block; font-family: var(--f-display); font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.hero .stat span { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.goal { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 14px 16px; }
.ring { width: 58px; height: 58px; flex: 0 0 58px; }
.ring circle { fill: none; stroke-width: 7; }
.ring .bg { stroke: var(--line); } .ring .fg { stroke: var(--green); stroke-linecap: round; transition: stroke-dashoffset .5s; }
.ring text { font-family: var(--f-display); font-size: 15px; font-weight: 700; fill: var(--ink); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.week div { text-align: center; font-size: 12px; font-weight: 800; color: var(--ink-soft); }
.week i { display: block; height: 30px; border-radius: 10px; background: var(--line); margin-bottom: 4px; }
.week i.on { background: var(--sun); } .week i.today { box-shadow: 0 0 0 3px var(--blue) inset; }
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.phrase { background: var(--blue-soft); border: 0; }
.phrase .es { font-family: var(--f-display); font-size: 20px; font-weight: 600; color: var(--blue); }
.speak { border: 0; background: var(--blue); color: #fff; width: 38px; height: 38px; border-radius: 12px; display: inline-grid; place-items: center; cursor: pointer; flex: 0 0 38px; }
.speak svg { width: 20px; height: 20px; }
.speak.big { width: 64px; height: 64px; border-radius: 20px; flex-basis: 64px; }
.speak.big svg { width: 32px; height: 32px; }
.speak.slow { background: var(--purple); }
.bar { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 999px; width: 0; transition: width .3s; }

/* deck list */
.unit h2 { margin-bottom: 4px; }
.decks { display: flex; flex-direction: column; gap: 8px; }
.deck { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 10px 12px; cursor: pointer; text-align: left; width: 100%; }
.deck:hover { border-color: var(--blue); }
.deck .ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 15px; }
.deck .ic.v { background: var(--blue-soft); color: var(--blue); }
.deck .ic.g { background: var(--purple-soft); color: var(--purple); }
.deck .ic.c { background: var(--coral-soft); color: var(--coral); }
.deck .ic.o { background: var(--sun-soft); color: #b07a00; }
.deck .t { min-width: 0; }
.deck .t b { display: block; font-weight: 800; line-height: 1.25; }
.deck .t small { color: var(--ink-soft); font-size: 13px; }
.deck .bar { display: block; margin-top: 6px; height: 6px; }
.deck .n { font-weight: 800; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* lesson */
.lesson { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.lesson .head { max-width: 560px; width: 100%; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 6px; }
.lesson .head .bar { flex: 1; height: 14px; }
.x { background: none; border: 0; cursor: pointer; width: 36px; height: 36px; display: grid; place-items: center; color: var(--ink-soft); }
.x svg { width: 22px; height: 22px; }
.lesson .body { flex: 1; overflow-y: auto; }
.lesson .body .in { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 24px; display: flex; flex-direction: column; gap: 16px; }
.kind { font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--purple); }
.prompt { font-family: var(--f-display); font-size: 26px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.prompt.es { color: var(--blue); }
.tip { background: var(--purple-soft); color: #4b2fb0; border-radius: 14px; padding: 10px 12px; font-size: 14px; font-weight: 700; }
.newcard { background: var(--surface); border: 2px solid var(--line); border-radius: 24px; padding: 22px 18px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.newcard .badge { background: var(--sun); font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; padding: 4px 10px; border-radius: 999px; }
.newcard .es { font-family: var(--f-display); font-size: 32px; font-weight: 700; color: var(--blue); line-height: 1.15; overflow-wrap: anywhere; }
.newcard .en { font-size: 19px; font-weight: 700; }
.newcard .note { color: var(--ink-soft); font-size: 15px; border-left: 4px solid var(--sun); padding-left: 10px; }
.conj { width: 100%; border-collapse: collapse; font-size: 16px; }
.conj td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
.conj td:first-child { color: var(--ink-soft); font-size: 14px; }
.conj td:last-child { font-weight: 800; color: var(--blue); text-align: right; }
.conj tr.hl td { background: var(--sun-soft); }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 16px; padding: 14px 16px; font-size: 17px; font-weight: 700; cursor: pointer; display: flex; gap: 12px; align-items: center; overflow-wrap: anywhere; }
.opt .k { flex: 0 0 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; color: var(--ink-soft); }
.opt:hover:not(:disabled) { border-color: var(--blue); }
.opt.sel { border-color: var(--blue); background: var(--blue-soft); }
.opt.right { border-color: var(--green); background: var(--green-soft); }
.opt.wrong { border-color: var(--coral); background: var(--coral-soft); }
.opt:disabled { cursor: default; }
.answer { width: 100%; font: 700 20px var(--f-body); padding: 14px 16px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.answer:focus { border-color: var(--blue); outline: none; }
.accents { display: flex; flex-wrap: wrap; gap: 6px; }
.accents button { border: 2px solid var(--line); background: var(--surface); border-radius: 10px; min-width: 38px; height: 38px; font-weight: 800; cursor: pointer; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; min-height: 58px; padding: 10px; border-radius: 16px; }
.tiles.target { border: 2px dashed var(--line); background: var(--surface); }
.tile { border: 2px solid var(--line); border-bottom-width: 4px; background: var(--surface); border-radius: 12px; padding: 8px 12px; font-weight: 800; font-size: 17px; cursor: pointer; }
.tile.used { visibility: hidden; }
.foot { border-top: 2px solid var(--line); background: var(--surface); padding-bottom: env(safe-area-inset-bottom, 0px); }
.foot .in { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px; display: flex; flex-direction: column; gap: 10px; }
.foot.ok { background: var(--green-soft); border-color: var(--green); }
.foot.no { background: var(--coral-soft); border-color: var(--coral); }
.verdict { font-family: var(--f-display); font-size: 22px; font-weight: 700; }
.foot.ok .verdict { color: var(--green-dark); } .foot.no .verdict { color: #c9393e; }
.solution { font-weight: 700; overflow-wrap: anywhere; }
.done { text-align: center; align-items: center; }
.done .big { font-family: var(--f-display); font-size: 54px; font-weight: 700; color: var(--green); }
.cards3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
.cards3 div { border: 2px solid var(--line); border-radius: 16px; padding: 10px; background: var(--surface); }
.cards3 b { display: block; font-family: var(--f-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.cards3 span { font-size: 12px; font-weight: 800; color: var(--ink-soft); }

/* bottom nav */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabbar button { background: none; border: 0; padding: 8px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 800; color: var(--ink-soft); cursor: pointer; }
.tabbar svg { width: 26px; height: 26px; }
.tabbar button[aria-current="page"] { color: var(--blue); }
.tabbar button[aria-current="page"] svg { background: var(--blue-soft); border-radius: 10px; }

/* grammar + words */
.gram { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.gram h3 { color: var(--purple); }
.gram table { width: 100%; border-collapse: collapse; font-size: 15px; }
.gram th, .gram td { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.gram th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
.gram .scroll { overflow-x: auto; }
.gram ul { margin: 0; padding-left: 18px; }
.gram b.e { color: var(--blue); }
.search { width: 100%; font: 700 16px var(--f-body); padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.wlist { display: flex; flex-direction: column; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; overflow: hidden; }
.w { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.w:last-child { border-bottom: 0; }
.w b { color: var(--blue); display: block; overflow-wrap: anywhere; }
.w span { font-size: 14px; color: var(--ink-soft); }
.w .lv { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--line); color: var(--ink-soft); white-space: nowrap; }
.w .lv.l1 { background: var(--sun-soft); color: #9a6a00; } .w .lv.l2 { background: var(--blue-soft); color: var(--blue); } .w .lv.l3 { background: var(--green-soft); color: var(--green-dark); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.review { display: flex; flex-direction: column; gap: 8px; text-align: left; width: 100%; }
.review div { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.review .y { color: #c9393e; text-decoration: line-through; }
.review .c { color: var(--green-dark); font-weight: 800; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

});
ORDERS.forEach(d => {
  const cards = d.items.trim().split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const [es, en] = l.split('|');
    return { id: d.id + ':' + es, deck: d.id, type: 'order', es: es.trim(), en: en.trim() };
  });
  addDeck({ id: d.id, unit: d.unit, title: d.title, en: d.en, kind: 'order' }, cards);

Object.keys(DECKMAP).forEach(d => { if (!ORDER.includes(d)) NEW_ORDER.push(...DECKMAP[d].ids); });

/* ---------- state ---------- */
const KEY = 'vamos-espanol-v1';
const today = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); };

try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); S = Object.assign(S, o); S.settings = Object.assign({ newPerDay: 20, autoplay: true }, o.settings || {}); } } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const INTERVALS = [0, 1, 2, 4, 7, 14, 30, 60, 120];
function st(id) { return S.cards[id]; }
function isLearned(id) { return !!S.cards[id]; }
function dueIds() { const t = today(); return Object.keys(S.cards).filter(id => CARDS[id] && S.cards[id].due <= t).sort((a, b) => S.cards[a].due - S.cards[b].due || S.cards[a].b - S.cards[b].b); }
function newLeftToday() { return Math.max(0, S.settings.newPerDay - (S.newLog[today()] || 0)); }
function nextNew(n, deck) { const pool = deck ? DECKMAP[deck].ids : NEW_ORDER; return pool.filter(id => !isLearned(id)).slice(0, n); }
function grade(id, ok) {
  const t = today();

  if (!c) { c = S.cards[id] = { b: 0, due: t, seen: 0, wrong: 0 }; S.newLog[t] = (S.newLog[t] || 0) + 1; }
  c.seen++;
  if (ok) { c.b = Math.min(c.b + 1, INTERVALS.length - 1); c.due = t + INTERVALS[c.b]; }
  else { c.wrong++; c.b = 1; c.due = t + 1; }
}
function addXP(n) { const t = today(); const d = S.days[t] = S.days[t] || { xp: 0, ex: 0 }; d.xp += n; d.ex++; }
function streak() { let t = today(), n = 0; if (!(S.days[t] && S.days[t].xp > 0)) t--; while (S.days[t] && S.days[t].xp > 0) { n++; t--; } return n; }

const canSpeak = 'speechSynthesis' in window;

function speak(text, slow) {
  if (!canSpeak) return;

    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\.\.\./g, ' ').replace(/ \/ /g, ', '));

}
function spBtn(text, cls = '') { return `<button class="speak ${cls}" type="button" data-say="${esc(text)}" aria-label="Listen">${ICONS.speaker}</button>`; }
document.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b) speak(b.dataset.say, b.dataset.slow === '1'); });

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function stripAcc(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ñ/g, 'n'); }
function norm(s) { return s.toLowerCase().replace(/\.\.\./g, ' ').replace(/[¿?¡!.,;:"“”()–-]/g, ' ').replace(/\s+/g, ' ').trim(); }
const ART = /^(el|la|los|las|un|una|unos|unas)\s+/;
function alts(es) {
  const out = new Set();
  es.split(' / ').forEach(a => { a = norm(a); if (!a) return; out.add(a); });

  const m = es.match(/^(el|la) \/ (el|la) (.+)$/); if (m) { out.add(norm(m[1] + ' ' + m[3])); out.add(norm(m[2] + ' ' + m[3])); out.add(norm(m[3])); }

  return [...out];

function check(input, card) {
  const u = norm(input); if (!u) return { ok: false };
  const list = card.type === 'vocab' ? alts(card.es) : [norm(card.es)];
  for (const a of list) if (u === a) return { ok: true };
  for (const a of list) if (stripAcc(u) === stripAcc(a)) return { ok: true, accent: true };

  return { ok: false };
}
function display(card) { return card.type === 'cloze' ? card.s.replace('___', card.es) : card.es; }
function deckOf(card) { return DECKMAP[card.deck]; }
function distractors(card, field, n) {
  const pool = deckOf(card).ids.map(id => CARDS[id]).filter(c => c.id !== card.id);
  const seen = new Set([card[field].toLowerCase()]);
  const out = [];
  for (const c of shuffle(pool)) { const v = c[field]; if (!seen.has(v.toLowerCase())) { seen.add(v.toLowerCase()); out.push(v); } if (out.length >= n) break; }
  if (out.length < n) { for (const id of shuffle(Object.keys(CARDS))) { const c = CARDS[id]; if (c.type !== card.type) continue; const v = c[field]; if (!seen.has(v.toLowerCase())) { seen.add(v.toLowerCase()); out.push(v); } if (out.length >= n) break; } }
  return out;
}

/* ---------- exercise builder ---------- */
function pickMode(card, isNew, forceHard) {
  const b = isNew ? 0 : (st(card.id) ? st(card.id).b : 0);
  const r = Math.random();
  if (card.type === 'vocab') {
    const longish = card.es.length > 34;
    if (b === 0 && !forceHard) return 'mc_es_en';
    if (b <= 1 && !forceHard) return r < 0.5 ? 'mc_en_es' : (canSpeak && !longish ? 'listen_mc' : 'mc_es_en');
    if (b === 2 && !forceHard) return r < 0.5 ? 'type_en_es' : 'mc_en_es';
    return canSpeak && !longish && r < 0.3 ? 'listen_type' : 'type_en_es';
  }
  if (card.type === 'conj') return (b <= 1 && !forceHard) ? 'conj_mc' : 'conj_type';
  if (card.type === 'cloze') return (b <= 2 && !forceHard) || card.opts.length > 3 ? 'cloze_mc' : 'cloze_type';
  return 'order';
}

    <div class="body"><div class="in" id="ex"></div></div><div class="foot" id="foot"><div class="in"><button class="btn big go" id="checkBtn" disabled>Check</button></div></div>`;
  $('#quit').onclick = quitAsk;
  const ex = $('#ex');
  L.answered = false;
  L.getAnswer = null;
  const setReady = v => { $('#checkBtn').disabled = !v; };
  const mkOpts = (arr, correct, field) => {
    const opts = shuffle([correct, ...arr]);
    ex.insertAdjacentHTML('beforeend', `<div class="opts">${opts.map((o, i) => `<button class="opt" type="button" data-v="${esc(o)}"><span class="k">${i + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>`);
    let sel = null;
    ex.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (L.answered) return; ex.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sel = b.dataset.v; setReady(true); if (field === 'es') speak(sel); });
    L.getAnswer = () => ({ value: sel, ok: sel === correct });
    L.markOpts = () => ex.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (b.dataset.v === correct) b.classList.add('right'); else if (b.classList.contains('sel')) b.classList.add('wrong'); });
  };
  const mkInput = (placeholder) => {
    ex.insertAdjacentHTML('beforeend', `<input class="answer" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${placeholder}">

    const inp = $('#ans');
    inp.oninput = () => setReady(inp.value.trim().length > 0);
    ex.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { const p = inp.selectionStart ?? inp.value.length; inp.value = inp.value.slice(0, p) + b.dataset.c + inp.value.slice(inp.selectionEnd ?? p); inp.focus(); inp.setSelectionRange(p + 1, p + 1); setReady(true); });
    setTimeout(() => inp.focus(), 50);
    L.getAnswer = () => { const r = check(inp.value, card); return { value: inp.value, ok: r.ok, accent: r.accent, article: r.article }; };
  };
  const kindLabel = { mc_es_en: 'What does this mean?', mc_en_es: 'Choose the Spanish', listen_mc: 'What do you hear?', type_en_es: 'Write it in Spanish', listen_type: 'Type what you hear', conj_mc: 'Conjugate', conj_type: 'Conjugate', cloze_mc: 'Fill the gap', cloze_type: 'Fill the gap', order: 'Build the sentence' }[mode];
  ex.insertAdjacentHTML('beforeend', `<div class="kind">${L.test ? 'Test · ' : ''}${kindLabel}${it.isNew && !L.test && card.type !== 'vocab' && card.type !== 'conj' ? ' · new' : ''}</div>`);

  if (mode === 'mc_es_en') {
    ex.insertAdjacentHTML('beforeend', `<div class="row">${spBtn(card.es)}<div class="prompt es">${esc(card.es)}</div></div>`);
    mkOpts(distractors(card, 'en', 3), card.en, 'en');
    if (S.settings.autoplay) speak(card.es);
  } else if (mode === 'mc_en_es') {
    ex.insertAdjacentHTML('beforeend', `<div class="prompt">${esc(card.en)}</div>`);
    mkOpts(distractors(card, 'es', 3), card.es, 'es');
  } else if (mode === 'listen_mc') {
    ex.insertAdjacentHTML('beforeend', `<div class="row">${spBtn(card.es, 'big')}<button class="speak big slow" type="button" data-say="${esc(card.es)}" data-slow="1" aria-label="Listen slowly">${ICONS.turtle}</button></div>`);
    mkOpts(distractors(card, 'es', 3), card.es, 'es');
    speak(card.es);
  } else if (mode === 'type_en_es') {
    ex.insertAdjacentHTML('beforeend', `<div class="prompt">${esc(card.en)}</div>`);

  } else if (mode === 'listen_type') {
    ex.insertAdjacentHTML('beforeend', `<div class="row">${spBtn(card.es, 'big')}<button class="speak big slow" type="button" data-say="${esc(card.es)}" data-slow="1" aria-label="Listen slowly">${ICONS.turtle}</button></div>`);

    ex.insertAdjacentHTML('beforeend', `<div class="prompt"><span class="es" style="color:var(--blue)">${esc(card.verb)}</span> <span class="muted" style="font-size:18px">(${esc(card.verbEn)})</span></div><div class="prompt" style="font-size:22px">${esc(PERSONS[card.p])} → ?</div>`);
    if (mode === 'conj_mc') mkOpts(shuffle(card.forms.filter(f => f !== card.es)).slice(0, 3), card.es, 'es');
    else mkInput('Type the form');
  } else if (mode === 'cloze_mc' || mode === 'cloze_type') {
    if (it.isNew && card.tip) ex.insertAdjacentHTML('beforeend', `<div class="tip">${esc(card.tip)}</div>`);
    ex.insertAdjacentHTML('beforeend', `<div class="prompt es">${esc(card.s).replace('___', '<span style="border-bottom:3px solid var(--sun);padding:0 18px">&nbsp;</span>')}</div>${card.en ? `<p class="muted">${esc(card.en)}</p>` : ''}`);
    if (mode === 'cloze_mc') mkOpts(card.opts.filter(o => o !== card.es), card.es, 'x');
    else mkInput('Type the missing word');

    ex.insertAdjacentHTML('beforeend', `<div class="prompt">${esc(card.en)}</div><div class="tiles target" id="tgt"></div><div class="tiles" id="src"></div>`);
    const words = card.es.split(' ');

    const src = $('#src'), tgt = $('#tgt'); const picked = [];
    order.forEach(i => { const b = document.createElement('button'); b.type = 'button'; b.className = 'tile'; b.textContent = words[i]; b.dataset.i = i; src.appendChild(b);

        t.onclick = () => { if (L.answered) return; const k = picked.indexOf(i); picked.splice(k, 1); t.remove(); b.classList.remove('used'); setReady(picked.length === words.length); };
        tgt.appendChild(t); setReady(picked.length === words.length); }; });
    L.getAnswer = () => { const val = picked.map(i => words[i]).join(' '); return { value: val, ok: norm(val) === norm(card.es) }; };
  }
  $('#checkBtn').onclick = doCheck;
}

function doCheck() {
  if (L.answered) { next(); return; }
  if (!L.getAnswer) return;
  const r = L.getAnswer(); if (r.value == null || r.value === '') return;
  L.answered = true;
  const it = L.items[L.i]; const card = CARDS[it.id];
  if (L.markOpts) { L.markOpts(); L.markOpts = null; }
  const inp = $('#ans'); if (inp) inp.disabled = true;
  const first = !(it.id in L.firstTry);
  if (first) L.firstTry[it.id] = r.ok;
  if (L.test) {
    if (r.ok) L.correct++; else L.wrongs.push({ card, given: r.value });
    next(); return;
  }
  if (first) { grade(it.id, r.ok); if (r.ok) L.correct++; }
  if (r.ok) { const gain = it.isNew ? 12 : 10; addXP(gain); L.xp += gain; }
  else {
    L.wrongs.push({ card, given: r.value });
    // re-queue a few steps later with an easier format
    const again = { id: it.id, isNew: false, mode: null, retry: true };
    L.items.splice(Math.min(L.items.length, L.i + 3), 0, again);
  }
  save();
  const foot = $('#foot');
  foot.className = 'foot ' + (r.ok ? 'ok' : 'no');
  const full = display(card);
  const extra = r.accent ? `<p class="small">Watch the accents: <b>${esc(full)}</b></p>` : r.article ? `<p class="small">Learn it with the article: <b>${esc(full)}</b></p>` : '';
  const praise = ['¡Muy bien!', '¡Perfecto!', '¡Genial!', '¡Eso es!', '¡Fenomenal!'][Math.floor(Math.random() * 5)];
  foot.innerHTML = `<div class="in"><div class="row" style="justify-content:space-between"><div class="verdict">${r.ok ? praise : 'Not quite'}</div>${spBtn(full)}</div>
    ${r.ok ? extra + (card.type === 'vocab' && card.note ? `<p class="small">${esc(card.note)}</p>` : '') : `<div class="solution">Correct answer: ${esc(full)}</div><p class="small">${esc(card.type === 'vocab' ? card.es + ' = ' + card.en : card.en || '')}</p>${card.note ? `<p class="small">${esc(card.note)}</p>` : ''}${card.tip ? `<p class="small">${esc(card.tip)}</p>` : ''}<p class="small">It'll come back in a moment.</p>`}
    <button class="btn big ${r.ok ? 'go' : 'coral'}" id="nextBtn">Continue</button></div>`;
  speak(full);
  $('#nextBtn').onclick = next; $('#nextBtn').focus();
}
function next() { L.i++; drawStep(); }

function drawDone() {
  const box = $('#lesson');
  const ids = Object.keys(L.firstTry);
  const acc = ids.length ? Math.round(100 * ids.filter(k => L.firstTry[k]).length / ids.length) : 0;
  if (L.test) {
    const total = L.total, score = L.correct;
    S.tests.push({ d: today(), scope: L.scope, score, total }); if (S.tests.length > 50) S.tests.shift();
    // missed test items become due today
    L.wrongs.forEach(w => { const c = S.cards[w.card.id]; if (c) { c.b = 1; c.due = today(); } else { S.cards[w.card.id] = { b: 1, due: today(), seen: 1, wrong: 1 }; } });
    addXP(score * 3); save();
    box.innerHTML = `<div class="body"><div class="in done"><div class="kind">Test result</div><div class="big">${score}/${total}</div><h2>${score / total >= 0.9 ? '¡Excelente! You know this unit.' : score / total >= 0.7 ? 'Good. Review the mistakes below.' : 'Keep going. Your mistakes are now in today’s reviews.'}</h2>
      ${L.wrongs.length ? `<div class="review">${L.wrongs.map(w => `<div><p class="small muted">${esc(w.card.type === 'cloze' ? w.card.s : w.card.type === 'conj' ? w.card.verb + ' · ' + PERSONS[w.card.p] : w.card.en)}</p><p><span class="y">${esc(w.given || '—')}</span> → <span class="c">${esc(display(w.card))}</span></p></div>`).join('')}</div>` : ''}
      </div></div><div class="foot"><div class="in"><button class="btn big go" id="fin">Done</button></div></div>`;
  } else {
    const dayXP = (S.days[today()] || {}).xp || 0;
    box.innerHTML = `<div class="body"><div class="in done"><div class="kind">Lesson complete</div><div class="big">+${L.xp} XP</div><h2>${acc >= 90 ? '¡Increíble!' : acc >= 70 ? '¡Muy bien!' : '¡Ánimo! Mistakes are how it sticks.'}</h2>
      <div class="cards3"><div><b>${acc}%</b><span>accuracy</span></div><div><b>${L.newCount}</b><span>new</span></div><div><b>${streak()}</b><span>day streak</span></div></div>
      <p class="muted">${dayXP >= GOAL ? 'Daily goal reached. Another lesson makes it stick even better.' : `Daily goal: ${dayXP} / ${GOAL} XP`}</p>
      </div></div><div class="foot"><div class="in"><button class="btn big go" id="fin">Continue</button></div></div>`;
  }
  $('#fin').onclick = closeLesson; $('#fin').focus();
}
let quitArmed = false;
function quitAsk() {
  if (L && L.test === false && L.i > 0 && !quitArmed) { quitArmed = true; toast('Tap × again to quit. Your progress so far is saved.'); setTimeout(() => quitArmed = false, 2500); return; }

}
document.addEventListener('keydown', e => {

/* ---------- session builders ---------- */
function buildDaily() {
  const due = dueIds().slice(0, 18);
  const nNew = Math.min(8, newLeftToday());
  const fresh = nextNew(nNew);
  // interleave: new cards spread among reviews, each new card also gets a later harder repeat
  const items = due.map(id => ({ id, isNew: false }));
  fresh.forEach((id, k) => { const pos = Math.min(items.length, k * 2 + 1); items.splice(pos, 0, { id, isNew: true }); });
  fresh.forEach(id => items.push({ id, isNew: false, hard: false, repeat: true }));
  return items;
}
function buildDeck(deckId, learnNew) {
  const ids = DECKMAP[deckId].ids;
  const learned = shuffle(ids.filter(isLearned)).slice(0, 12).map(id => ({ id, isNew: false }));
  const fresh = learnNew ? nextNew(8, deckId) : [];
  const items = learned.slice();
  fresh.forEach((id, k) => items.splice(Math.min(items.length, k * 2), 0, { id, isNew: true }));
  fresh.forEach(id => items.push({ id, isNew: false }));
  return items;
}
function buildTest(scope) {
  const ids = Object.keys(CARDS).filter(id => scope === 'all' || DECKMAP[CARDS[id].deck].unit === scope);
  const pick = shuffle(ids).slice(0, 20);
  return pick.map(id => ({ id, isNew: false, hard: Math.random() < 0.5 }));
}

function deckSheet(d) {

    <div class="body"><div class="in"><p class="muted">${esc(m.en)} · ${k} of ${m.ids.length} learned</p>${m.tip ? `<div class="tip">${esc(m.tip)}</div>` : ''}
    <div class="wlist">${rows}</div></div></div>
    <div class="foot"><div class="in"><button class="btn big go" id="learn" ${left ? '' : 'disabled'}>${left ? `Learn ${Math.min(8, left)} new` : 'All cards learned'}</button><button class="btn big" id="rev" ${k ? '' : 'disabled'}>Review this topic</button></div></div>`;
  $('#quit').onclick = () => { $('#lesson').hidden = true; document.body.style.overflow = ''; };
  $('#learn').onclick = () => startLesson({ title: m.title, items: buildDeck(d, true), test: false });
  $('#rev').onclick = () => startLesson({ title: m.title, items: buildDeck(d, false), test: false });
}

function testView(v) {
  const hist = S.tests.slice(-6).reverse();
  v.innerHTML = `<div><h1>Test yourself</h1><p class="muted">20 mixed questions, like a class test: vocabulary, verbs, grammar gaps and sentences, including cards you haven't learned yet. No feedback until the end. Every mistake goes straight into today's reviews.</p></div>
    <div class="decks">${[['u1', 'Unidad 1 · Nos conocemos', 'Sessions 1–2'], ['u2', 'Unidad 2 · Comida en familia', 'Sessions 3–4'], ['b', 'Basics', 'Question words, days, colours, ir / hacer / poder'], ['all', 'Everything', 'Full mock test']].map(([id, t, s]) => `<button class="deck" type="button" data-scope="${id}"><span class="ic o">20</span><span class="t"><b>${t}</b><small>${s}</small></span><span class="n">Start</span></button>`).join('')}</div>
    <div class="panel"><h3>Recent results</h3>${hist.length ? hist.map(h => `<div class="row" style="justify-content:space-between"><span class="small">${esc({ u1: 'Unidad 1', u2: 'Unidad 2', b: 'Basics', all: 'Everything' }[h.scope] || h.scope)} · ${new Date(h.d * 86400000).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' })}</span><b>${h.score}/${h.total}</b></div>`).join('') : '<p class="small muted">No tests yet. Try Unidad 1 once you’ve done a few lessons.</p>'}</div>`;
  v.querySelectorAll('[data-scope]').forEach(b => b.onclick = () => startLesson({ title: 'Test', items: buildTest(b.dataset.scope), test: true, scope: b.dataset.scope }));
}

function conjTable(names) {
  const vs = names.map(n => VERBS.find(x => x.v === n));
  return `<div class="scroll"><table><tr><th></th>${vs.map(x => `<th>${x.v}</th>`).join('')}</tr>${PERSONS.map((p, i) => `<tr><td class="muted">${p}</td>${vs.map(x => `<td><b class="e">${x.f.split(',')[i]}</b></td>`).join('')}</tr>`).join('')}</table></div>`;
}
function grammarView(v) {
  const G = [
    ['Presente regular: -ar, -er, -ir', `<div class="scroll"><table><tr><th></th><th>hablar</th><th>comprender</th><th>vivir</th></tr>
      ${PERSONS.map((p, i) => `<tr><td class="muted">${p}</td><td>habl<b class="e">${['o', 'as', 'a', 'amos', 'áis', 'an'][i]}</b></td><td>comprend<b class="e">${['o', 'es', 'e', 'emos', 'éis', 'en'][i]}</b></td><td>viv<b class="e">${['o', 'es', 'e', 'imos', 'ís', 'en'][i]}</b></td></tr>`).join('')}</table></div>
      <p class="small muted">-er and -ir only differ in nosotros and vosotros.</p>`, 'g-regulares'],
    ['Llamarse, ser, tener', conjTable(['llamarse', 'ser', 'tener']) + `<p class="small">Age uses <b>tener</b>: <i>tengo 20 años</i>. Origin uses <b>ser de</b>: <i>soy de Alemania</i>.</p>`, 'g-llamarse'],
    ['Querer + infinitivo', conjTable(['querer']) + `<p class="small"><i>Quiero salir de noche, pero no quiero ir al cine.</i></p>`, 'g-querer'],
    ['El género de los sustantivos', `<div class="scroll"><table><tr><th>Ending</th><th>Gender</th><th>Exceptions</th></tr>
      <tr><td>-o</td><td>el libro, el chico</td><td>la mano, la foto, la moto, la radio</td></tr>
      <tr><td>-a</td><td>la mesa, la chica</td><td>el problema, el mapa, el día, el idioma</td></tr>
      <tr><td>-ción, -sión, -dad</td><td>la canción, la televisión, la ciudad</td><td></td></tr>
      <tr><td>-e</td><td>el café, el coche, el padre</td><td>la calle, la llave, la madre</td></tr>
      <tr><td>-or</td><td>el ordenador, el rotulador</td><td>la flor</td></tr>
      <tr><td>consonant</td><td>el lápiz, el árbol</td><td>la luz</td></tr></table></div>
      <p class="small"><b>Articles:</b> el / los (masculine), la / las (feminine) · un / una (a, an)</p>`, 'g-genero'],
    ['Adjetivos: masculino → femenino', `<ul class="small"><li>-o → -a: listo → <b class="e">lista</b>, alto → <b class="e">alta</b></li><li>-or and consonant nationalities + a: trabajador → <b class="e">trabajadora</b>, francés → <b class="e">francesa</b></li><li>-e, -ista: no change: fuerte, independiente, optimista, ecologista</li></ul>`, 'g-adjetivos'],
    ['El plural', `<ul class="small"><li>Vowel + <b class="e">s</b>: la fiesta → las fiestas</li><li>Consonant + <b class="e">es</b>: el autobús → los autobuses, el profesor → los profesores</li><li>-z → <b class="e">-ces</b>: el lápiz → los lápices</li><li>The written accent can move or disappear: la canción → las canciones</li></ul>`, 'g-plural'],
    ['Por, para, porque', `<ul class="small"><li><b class="e">para</b> + infinitive = purpose: <i>para viajar</i></li><li><b class="e">por</b> + noun = cause: <i>por mi trabajo</i></li><li><b class="e">porque</b> + sentence = because: <i>porque mi novio es colombiano</i></li><li><b class="e">¿por qué?</b> = why? (two words, accent)</li></ul>`, 'g-porpara'],
    ['Describir: ser, tener, llevar', `<div class="scroll"><table><tr><th>SER</th><th>TENER</th><th>LLEVAR</th></tr><tr><td>alto, bajo, delgado, guapo, joven, mayor, rubio, moreno, calvo + character</td><td>el pelo corto / largo / liso / rizado, los ojos verdes, la nariz grande, pecas</td><td>gafas, barba, bigote, pendientes, una camisa, una trenza</td></tr></table></div>`, 'g-stl'],
    ['Ser y estar', conjTable(['ser', 'estar']) + `<ul class="small"><li><b>SER:</b> identity, origin, profession, character, description</li><li><b>ESTAR:</b> location (Barcelona está en España) and mood or state (estoy cansado)</li></ul>`, 'g-serestar'],
    ['Los posesivos', `<div class="scroll"><table><tr><th></th><th>singular</th><th>plural</th></tr><tr><td>my</td><td>mi hermano</td><td>mis padres</td></tr><tr><td>your</td><td>tu madre</td><td>tus abuelos</td></tr><tr><td>his / her / their / your (usted)</td><td>su hermano</td><td>sus padres</td></tr><tr><td>our</td><td>nuestro / nuestra</td><td>nuestros / nuestras</td></tr><tr><td>your (vosotros)</td><td>vuestro / vuestra</td><td>vuestros / vuestras</td></tr></table></div>`, 'g-posesivos'],
    ['Gustar, encantar, odiar', `<ul class="small"><li><b class="e">me gusta</b> + singular or infinitive: me gusta el queso, me gusta cocinar</li><li><b class="e">me gustan</b> + plural: me gustan las fresas</li><li>me encanta(n) 😍 · me gusta(n) 😊 · no me gusta(n) ☹️ · odio 😠</li><li>me / te / le / nos / os / les + gusta</li></ul>
      <div class="scroll"><table><tr><th>You hear</th><th>Agree</th><th>Disagree</th></tr><tr><td>Me gusta… (+)</td><td>A mí también</td><td>A mí no</td></tr><tr><td>No me gusta… (−)</td><td>A mí tampoco</td><td>A mí sí</td></tr></table></div>`, 'g-gustar'],
    ['En el restaurante', `<ul class="small"><li><b>Waiter:</b> ¿Qué desea? · ¿Qué le pongo? · ¿Para beber? · ¿Y de segundo? · ¿Algo más? · ¿Postre o café?</li><li><b>You:</b> De primero, quiero… · De segundo… · Para mí… · ¿Qué lleva? · ¿Me trae un poco de pan? · La cuenta, por favor · ¿Cuánto es?</li><li><b>llevar</b> = to contain (la paella lleva arroz) · <b>poner</b> = to serve (¿me pones un café?) · <b>traer</b> = to bring (¿me trae la cuenta?)</li></ul>` + conjTable(['poner', 'traer']), 'g-restaurante'],
    ['Saludos y horas', `<ul class="small"><li>Buenos días: 5:00–12:00</li><li>Buenas tardes: 12:00–20:00</li><li>Buenas noches: after 20:00</li><li>Meals: desayuno 7–9 · comida 13:30–15:30 · merienda 17–18:30 · cena 20:30–22</li></ul>`, 'g-saludos'],
    ['Verbos irregulares útiles', conjTable(['ir', 'hacer', 'poder']), 'c:ir']
  ];
  v.innerHTML = `<div><h1>Grammar</h1><p class="muted">Everything from sessions 1–4 on one page. Read a box, then practise it straight away.</p></div>`;
  G.forEach(([t, html, deck]) => {
    const g = document.createElement('div'); g.className = 'gram';
    g.innerHTML = `<h3>${t}</h3>${html}<div class="row"><button class="btn slim blue" type="button">Practise this</button></div>`;
    $('button', g).onclick = () => deckSheet(deck);
    v.appendChild(g);
  });
}

let wq = '', wf = 'all';
function wordsView(v) {
  v.innerHTML = `<div><h1>Words</h1><p class="muted">Every word and phrase in the app. Search in Spanish or English and tap to listen.</p></div>
    <input class="search" id="q" placeholder="Search…" value="${esc(wq)}" autocomplete="off">
    <div class="seg" id="wf">${[['all', 'All'], ['learned', 'Learned'], ['weak', 'Weak'], ['new', 'Not yet']].map(([k, l]) => `<button type="button" data-k="${k}" aria-pressed="${wf === k}">${l}</button>`).join('')}</div>
    <div class="wlist" id="wl"></div>`;
  const draw = () => {
    const q = stripAcc(norm(wq));
    let ids = Object.keys(CARDS).filter(id => CARDS[id].type === 'vocab');
    if (wf === 'learned') ids = ids.filter(isLearned);
    if (wf === 'new') ids = ids.filter(id => !isLearned(id));
    if (wf === 'weak') ids = ids.filter(id => S.cards[id] && (S.cards[id].wrong > 0 && S.cards[id].b <= 2));
    if (q) ids = ids.filter(id => stripAcc(norm(CARDS[id].es + ' ' + CARDS[id].en)).includes(q));
    const shown = ids.slice(0, 250);
    $('#wl').innerHTML = shown.length ? shown.map(id => { const c = CARDS[id]; const s = S.cards[id]; const lv = !s ? ['', 'new'] : s.b >= 4 ? ['l3', 'strong'] : s.b >= 2 ? ['l2', 'learning'] : ['l1', 'fresh'];
      return `<div class="w"><div><b>${esc(c.es)}</b><span>${esc(c.en)}</span></div><div class="row" style="flex-wrap:nowrap"><span class="lv ${lv[0]}">${lv[1]}</span>${spBtn(c.es)}</div></div>`; }).join('') : '<div class="w"><span>No words match.</span></div>';
  };
  draw();
  $('#q').oninput = e => { wq = e.target.value; draw(); };
  v.querySelectorAll('#wf button').forEach(b => b.onclick = () => { wf = b.dataset.k; v.querySelectorAll('#wf button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); draw(); });
}

/* toast */
function toast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); t.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:#fff;font-weight:700;padding:10px 16px;border-radius:14px;max-width:calc(100% - 32px);text-align:center;font-size:14px'; document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, 2600);
}

render();
